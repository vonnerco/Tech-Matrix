name: Deploy worker

# Publishes The Cloudflare Worker (the /score API, the batch Durable Object, and
# the static site in docs/) when its source, config, or the site changes on main,
# or on demand. The Worker serves docs/ as assets (see wrangler.jsonc), so a docs
# change must redeploy it or that origin goes stale. GitHub Pages serves docs/ too.
#
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   token from dash.cloudflare.com "My Profile -> API
#                          Tokens", using the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  dashboard sidebar (Workers & Pages -> Account ID),
#                          or `npx wrangler whoami`
# Never commit the token: only repo secrets are read here.

on:
  push:
    branches: [main]
    # Only the files that actually change the deployable Worker or the site it
    # serves. Doc-only edits under worker/ (README, etc.) do not redeploy it.
    paths:
      - "worker/src/**"
      - "worker/wrangler.jsonc"
      - "worker/package.json"
      - "worker/package-lock.json"
      - "worker/migrations/**"
      # The Worker serves the static site from docs/ (wrangler.jsonc assets),
      # so a site change must redeploy it.
      - "docs/**"
      # Editing this workflow should itself redeploy, so path-filter changes
      # take effect without needing a separate triggering commit.
      - ".github/workflows/deploy-worker.yml"
  # Lets you deploy the worker on demand from the Actions tab. Use this for the
  # first run, after adding the two secrets below.
  workflow_dispatch:

# One deploy at a time; let a running deploy finish rather than cancel it.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Pinned so the image doesn't move under us (ubuntu-latest migrates to
    # Ubuntu 26 in October 2026).
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Check credentials
        working-directory: worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          npx wrangler whoami

      # Deploys src/ and applies any pending Durable Object migration declared
      # in wrangler.jsonc. D1 schema migrations are applied separately (they
      # change stored data), so they are deliberately not run here.
      - name: Deploy
        working-directory: worker
        run: npx wrangler deploy
