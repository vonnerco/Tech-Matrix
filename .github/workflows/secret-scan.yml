name: Secret scan

# Two layers, so a credential cannot reach GitHub:
#   1. scripts/secret-scan.sh — no account needed, always runs.
#   2. ggshield            — runs when the GITGUARDIAN_API_KEY secret is set,
#                             and is skipped with a notice when it is not.
# The same pattern scan also runs locally in .githooks/pre-commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Pattern scan (no account needed)
        run: sh scripts/secret-scan.sh tree

      - id: gg
        env:
          KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
          fi

      # pipx is preinstalled on GitHub-hosted Ubuntu images.
      - name: Install ggshield
        if: steps.gg.outputs.on == 'true'
        run: pipx install ggshield

      # Honours .gitguardian.yaml, including its ignored_paths.
      - name: ggshield scan
        if: steps.gg.outputs.on == 'true'
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: ggshield secret scan path -r .

      - name: ggshield skipped
        if: steps.gg.outputs.on != 'true'
        run: echo "::notice::GITGUARDIAN_API_KEY is not set — ggshield skipped. The pattern scan above still ran."
