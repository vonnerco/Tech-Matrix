<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Sign in — Resume-Tailor</title>
        <script>
            // Self-healing cache check. GitHub Pages caches HTML/JS for ~10 min,
            // so a plain reload can keep serving stale assets. If the deployed
            // build differs from BUILD below, reload once with a cache-busting
            // query. Bump BUILD and version.json together on every deploy.
            (function () {
                var BUILD = "20261016h";
                try {
                    fetch("version.json?_=" + Date.now(), { cache: "no-store" })
                        .then(function (r) {
                            return r.ok ? r.json() : null;
                        })
                        .then(function (d) {
                            if (!d || !d.build || d.build === BUILD) return;
                            var key = "cache-bust:" + d.build;
                            if (sessionStorage.getItem(key)) return;
                            sessionStorage.setItem(key, "1");
                            var u = new URL(location.href);
                            u.searchParams.set("_v", d.build);
                            location.replace(u.toString());
                        })
                        .catch(function () {});
                } catch (e) {}
            })();
        </script>
        <style>
            :root {
                --ink: #1f3057;
                --muted: #5b6472;
                --line: #d9dee7;
                --bad: #b31b1b;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                font-family:
                    -apple-system,
                    Segoe UI,
                    Roboto,
                    Helvetica,
                    Arial,
                    sans-serif;
                color: #17202a;
                background: #f4f6f9;
            }
            header {
                background: var(--ink);
                color: #fff;
                padding: 24px 20px;
            }
            header h1 {
                margin: 0 0 4px;
                font-size: 20px;
            }
            header p {
                margin: 0;
                color: #c8d0dd;
                font-size: 13px;
            }
            .wrap {
                max-width: 420px;
                margin: 40px auto;
                padding: 0 20px;
            }
            .card {
                background: #fff;
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 24px;
                box-shadow: 0 1px 3px rgba(20, 30, 50, 0.06);
            }
            label {
                display: block;
                font-size: 13px;
                font-weight: 600;
                color: var(--muted);
                margin: 0 0 6px;
            }
            input[type="email"],
            input[type="password"] {
                width: 100%;
                padding: 12px 14px;
                font-size: 15px;
                border: 1px solid var(--line);
                border-radius: 8px;
                outline: none;
                margin-bottom: 14px;
            }
            input:focus {
                border-color: var(--ink);
                box-shadow: 0 0 0 3px rgba(31, 48, 87, 0.12);
            }
            button {
                width: 100%;
                border: 0;
                border-radius: 8px;
                padding: 12px 18px;
                font-size: 15px;
                font-weight: 600;
                cursor: pointer;
                color: #fff;
                background: var(--ink);
            }
            button:hover {
                filter: brightness(1.06);
            }
            button:disabled {
                opacity: 0.6;
                cursor: default;
            }
            .status {
                font-size: 13px;
                font-weight: 600;
                color: var(--ink);
                margin-top: 12px;
                min-height: 18px;
            }
            .status.err {
                color: var(--bad);
            }
            .hint {
                font-size: 12px;
                color: var(--muted);
                margin-top: 12px;
            }
            [hidden] {
                display: none !important;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Resume-Tailor</h1>
            <p>Invite-only access.</p>
        </header>

        <div class="wrap">
            <div class="card">
                <!-- Sign in (returning users) -->
                <form id="signin-form">
                    <label for="email">Email</label>
                    <input
                        id="email"
                        type="email"
                        autocomplete="email"
                        required
                    />
                    <label for="password">Password</label>
                    <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        required
                    />
                    <button id="btn-signin" type="submit">Sign in</button>
                    <div id="status" class="status"></div>
                    <p class="hint">
                        Access is invite-only. If you received an invite, use
                        the link in that email to set your password. Lost
                        access? Ask an admin to send a new invite.
                    </p>
                </form>

                <!-- Set password (invite / recovery link) -->
                <form id="setpw-form" hidden>
                    <label for="newpw">Choose a password</label>
                    <input
                        id="newpw"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    />
                    <label for="newpw2">Confirm password</label>
                    <input
                        id="newpw2"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    />
                    <button id="btn-setpw" type="submit">Save password</button>
                    <div id="status2" class="status"></div>
                </form>
            </div>
        </div>

        <script src="vendor/supabase.min.js"></script>
        <script src="config.js?v=20261014c"></script>
        <script src="login.js?v=20261015b"></script>
    </body>
</html>
